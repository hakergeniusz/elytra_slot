[package]
name = "elytra_slot"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "The survival inventory gains an elytra slot beside the armor row: the chestplate stays worn, gliding works from the slot. A Horizon native mod."
publish = false

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
